name: Deploy Frontend

# Push ke main: periksa + bangun image (ghcr.io/ideora-tech/hr-employee-frontend:<hash>).
# Produksi: Actions > "Deploy Frontend" > Run workflow (tag kosong = commit terbaru main).
# Rilis yang menyentuh backend DAN frontend: naikkan backend dulu sampai sehat.
# Panduan lengkap: D:\PROJECT-HR\deploy-ci.txt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Hash commit lengkap (40 karakter) yang image-nya sudah dibangun. Kosong berarti commit terbaru di branch yang dipilih.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  periksa:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: starter/package-lock.json
      # package-lock.json dibuat npm 11 (laptop); npm 10 bawaan Node 20 menolaknya.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit

  bangun:
    needs: periksa
    if: github.event_name == 'push' && vars.DEPLOY_AKTIF == 'ya'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nama image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/hr-employee-frontend" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: starter
          file: starter/Dockerfile
          platforms: ${{ vars.VPS_PLATFORM || 'linux/amd64' }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false
          sbom: false
          # NEXT_PUBLIC_* di-embed saat build (sama dengan scripts/deploy-lokal.ps1 di repo backend).
          build-args: |
            NEXT_PUBLIC_BACKEND_API_URL=${{ vars.NEXT_PUBLIC_BACKEND_API_URL || 'https://api.ideora-tech.com' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Ringkasan
        run: |
          {
            echo "### Image frontend siap"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Naikkan ke produksi: Actions > Deploy Frontend > Run workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  naikkan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: produksi
    concurrency:
      group: deploy-hr-produksi
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.VPS_HOST }}
      PENGGUNA: ${{ secrets.VPS_USER }}
      PORT_SSH: ${{ secrets.VPS_PORT || '22' }}
      TAG: ${{ inputs.tag || github.sha }}
      AKTOR: ${{ github.repository_owner }}
    steps:
      - name: Periksa masukan dan image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "Tag harus hash commit lengkap (40 karakter)."; exit 1; }
          IMAGE="ghcr.io/${AKTOR,,}/hr-employee-frontend:$TAG"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$AKTOR" --password-stdin > /dev/null
          docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1 || {
            echo "Image $IMAGE belum ada. Tunggu run push untuk commit ini selesai (job 'bangun'), atau isi tag dengan hash yang sudah dibangun."
            exit 1
          }
          docker logout ghcr.io > /dev/null
      - name: Siapkan SSH
        env:
          KUNCI: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          [[ -n "$HOST" && -n "$PENGGUNA" && -n "$KUNCI" && -n "$KNOWN_HOSTS" ]] || { echo "Secret VPS_HOST, VPS_USER, VPS_SSH_KEY, atau VPS_KNOWN_HOSTS belum diisi."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KUNCI" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 20\n' \
            "$HOST" "$PENGGUNA" "$PORT_SSH" > ~/.ssh/config
      - name: Naikkan
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh vps "naikkan frontend $TAG $AKTOR"
      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Frontend ke produksi"
            echo "Commit: \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rapikan:
    needs: bangun
    if: needs.bangun.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: hr-employee-frontend
          package-type: container
          min-versions-to-keep: 8
